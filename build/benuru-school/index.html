function renderModule(){
  const el = document.getElementById('main');
  const map = {dashboard:mDashboard,students:mStudents,admissions:mAdmissions,academics:mAcademics,attendance:mAttendance,fees:mFees,timetable:mTimetable,staff:mStaff,library:mLibrary,transport:mTransport,inventory:mInventory,communication:mCommunication,reports:mReports,settings:mSettings,
    parent_overview:pOverview,parent_academics:pAcademics,parent_attendance:pAttendance,parent_fees:pFees,parent_timetable:mTimetable};
  el.innerHTML = (map[S.module]||mDashboard)();
}
function heading(title,sub){ return `<div class="mb-6"><h1 class="serif text-2xl text-navy-900">${title}</h1>${sub?`<p class="text-sm text-navy-700/55 mt-0.5">${sub}</p>`:''}</div>`; }
function statCard(label,val,sub,iconId){ return `<div class="card p-4"><div class="flex items-start justify-between"><div><div class="text-xs text-navy-700/50 mb-1">${label}</div><div class="serif text-2xl text-navy-900">${val}</div>${sub?`<div class="text-xs text-navy-700/45 mt-1">${sub}</div>`:''}</div><div class="w-9 h-9 rounded-lg bg-gold-500/10 text-gold-500 flex items-center justify-center shrink-0">${icon(iconId,'w-4.5 h-4.5')}</div></div></div>`; }

/* ---- DASHBOARD ---- */

  return `
  ${heading('Dashboard', `${S.roleLabel} · ${TERM} · ${CAMPUS}`)}
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
    ${statCard('Total Students', students.length+"  (demo set)", "8 shown of 612 enrolled", 'students')}
    ${statCard('Today\'s Attendance', avgAtt+"%", absentToday+" absent today", 'attendance')}
    ${statCard('Fee Collection (Term)', fmt(collected), 'Across '+payments.length+' payments', 'fees')}
    ${statCard('Outstanding Fees', fmt(totalBal), students.filter(s=>s.balance>0).length+' students with balance', 'fees')}
  </div>
  <div class="grid lg:grid-cols-3 gap-4 mb-6">
    <div class="card p-5 lg:col-span-2">
      <div class="flex items-center justify-between mb-4"><h3 class="font-semibold text-navy-900 text-sm">Attendance Trend — this week</h3></div>
      <div class="flex items-end gap-3 h-32">
        ${[88,91,85,94,avgAtt].map((v,i)=>`<div class="flex-1 flex flex-col items-center gap-1"><div class="w-full bg-gold-500/15 rounded-t-md flex items-end" style="height:100px"><div class="w-full bg-gold-500 rounded-t-md" style="height:${v}%"></div></div><div class="text-[10px] text-navy-700/45">${['Mon','Tue','Wed','Thu','Today'][i]}</div></div>`).join('')}
      </div>
    </div>
    <div class="card p-5">
      <h3 class="font-semibold text-navy-900 text-sm mb-4">Class Enrollment</h3>
      <div class="space-y-2.5">
        ${['Grade 7','Form 2','Grade 5','Grade 3'].map(c=>{const demoEnrollment={'Grade 7':48,'Form 2':42,'Grade 5':51,'Grade 3':44}; const n=students.filter(s=>s.cls===c).length||demoEnrollment[c]||36; const shown=n>4?n:n+34; return `<div><div class="flex justify-between text-xs mb-1"><span class="text-navy-700/70">${c}</span><span class="text-navy-900 font-medium">${shown}</span></div>${bar(shown,60)}</div>`}).join('')}
      </div>
    </div>
  </div>
  <div class="grid lg:grid-cols-3 gap-4">
    <div class="card p-5 lg:col-span-2">
      <h3 class="font-semibold text-navy-900 text-sm mb-3">Recent Activity</h3>
      <div class="space-y-3">
        ${payments.slice(0,4).map(p=>`<div class="flex items-center justify-between text-sm"><div class="flex items-center gap-2.5"><div class="w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">${icon('fees','w-3.5 h-3.5')}</div><div><div class="text-navy-900">${p.student} paid ${fmt(p.amount)}</div><div class="text-xs text-navy-700/45">${p.method} · ${p.date}</div></div></div><span class="badge bg-emerald-100 text-emerald-700">${p.status}</span></div>`).join('')}
      </div>
    </div>
    <div class="card p-5">
      <h3 class="font-semibold text-navy-900 text-sm mb-3">Upcoming Events</h3>
      <div class="space-y-3">
        ${events.map(e=>`<div class="text-sm"><div class="text-navy-900 font-medium">${e.name}</div><div class="text-xs text-navy-700/45">${e.date} · ${e.audience}</div></div>`).join('')}
      </div>
    </div>

    ${[['Add Student','students'],['Record Payment','fees'],['Mark Attendance','attendance'],['Enter Marks','academics'],['Add Announcement','communication'],['Generate Report','reports']].map(([l,m])=>`<button onclick="go('${m}')" class="px-3.5 py-2 rounded-lg bg-navy-900 text-cream text-xs font-medium hover:bg-navy-800">${l}</button>`).join('')}

/* ---- STUDENTS ---- */
function mStudents(){

  return `
  ${heading('Students', filtered.length+' of '+students.length+' shown')}

    <select onchange="S.classFilter=this.value;renderModule()" class="text-sm">
      <option ${S.classFilter==='All'?'selected':''}>All</option>

  </div>

      <thead><tr class="text-left text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th>Adm No.</th><th>Name</th><th>Class</th><th>Guardian</th><th>Attendance</th><th>Fee Balance</th><th>Status</th><th></th></tr></thead>

          <td>${s.cls} ${s.stream}</td>

function openStudent(id){ studentTab='Overview'; openModal('studentProfile', id); }

  const avg = Math.round(Object.values(s.marks).reduce((a,b)=>a+b,0)/Object.values(s.marks).length);
  let body='';
  if(studentTab==='Overview') body=`
    <div class="grid sm:grid-cols-2 gap-4 text-sm">

      <div><div class="text-xs text-navy-700/45">Date of birth</div><div class="text-navy-900">${s.dob}</div></div>
      <div><div class="text-xs text-navy-700/45">Gender</div><div class="text-navy-900">${s.gender==='F'?'Female':'Male'}</div></div>
      <div><div class="text-xs text-navy-700/45">Class / Stream</div><div class="text-navy-900">${s.cls} ${s.stream}</div></div>
      <div><div class="text-xs text-navy-700/45">Previous school</div><div class="text-navy-900">${s.prev}</div></div>
      <div><div class="text-xs text-navy-700/45">Guardian</div><div class="text-navy-900">${s.guardian} · ${s.phone}</div></div>
      <div><div class="text-xs text-navy-700/45">Status</div><span class="badge bg-emerald-100 text-emerald-700">${s.status}</span></div>
    </div>`;
  else if(studentTab==='Academics') body=`
    <table class="w-full text-sm"><thead><tr class="text-left text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th>Subject</th><th>Score</th><th>Grade</th></tr></thead>
    <tbody>${Object.entries(s.marks).map(([sub,m])=>`<tr><td>${sub}</td><td>${m}</td><td><span class="badge ${gradeColor(gradeOf(m))}">${gradeOf(m)}</span></td></tr>`).join('')}</tbody></table>
    <div class="mt-3 text-sm text-navy-700/70">Average: <span class="font-semibold text-navy-900">${avg}%</span> — <span class="italic">${s.comment}</span></div>`;
  else if(studentTab==='Attendance') body=`<div class="text-sm mb-3">Term attendance rate: <span class="font-semibold text-navy-900">${s.att}%</span></div>${bar(s.att,100)}<div class="text-xs text-navy-700/45 mt-3">Today: <span class="font-medium text-navy-900">${attendanceToday[s.id]}</span></div>`;
  else if(studentTab==='Fees') body=`<div class="flex justify-between text-sm mb-3"><span>Balance</span><span class="${s.balance>0?'text-rose-600':'text-emerald-600'} font-semibold">${fmt(s.balance)}</span></div>
    <button onclick="closeModal();openModal('payment',${s.id})" class="px-3.5 py-2 rounded-lg bg-navy-900 text-cream text-xs font-medium">Record Payment</button>`;
  else if(studentTab==='Documents') body=`<div class="text-sm text-navy-700/50">Birth certificate, admission form and medical form on file (metadata only in this demo).</div>`;
  else if(studentTab==='Discipline') body=(discipline.filter(d=>d.student===s.name).map(d=>`<div class="text-sm border-b border-[#EFEAE0] py-2"><div class="font-medium text-navy-900">${d.incident}</div><div class="text-xs text-navy-700/45">${d.date} · ${d.action}</div></div>`).join('')||`<div class="text-sm text-navy-700/40">No discipline records on file.</div>`);
  return `
  <div class="flex items-center gap-3 mb-5">
    <div class="w-14 h-14 rounded-full bg-navy-900 text-gold-300 flex items-center justify-center font-semibold serif text-lg">${s.name.split(' ').map(w=>w[0]).join('')}</div>

  </div>
  <div class="flex gap-4 border-b border-[#EFEAE0] mb-4 overflow-x-auto text-sm">
    ${tabs.map(t=>`<button onclick="studentTab='${t}';openModal('studentProfile',${id})" class="pb-2 shrink-0 ${studentTab===t?'tab-active':'text-navy-700/50'}">${t}</button>`).join('')}
  </div>
  <div>${body}</div>`;
}

function modalPayment(id){
  const s=students.find(x=>x.id===id);
  return `<h3 class="serif text-xl text-navy-900 mb-1">Record Payment</h3><p class="text-sm text-navy-700/50 mb-5">${s.name} · ${s.adm} · Balance: <span class="font-medium text-rose-600">${fmt(s.balance)}</span></p>
  <div class="space-y-3">

    <div><label class="block text-xs font-medium text-navy-700/60 mb-1">Payment method</label><select id="payMethod" class="w-full"><option>M-Pesa</option><option>Bank</option><option>Cash</option><option>Card</option><option>Other</option></select></div>
    <div><label class="block text-xs font-medium text-navy-700/60 mb-1">Transaction reference</label><input id="payRef" placeholder="Auto-generated if left blank" class="w-full"></div>
  </div>
  <div class="flex gap-2 mt-6">
    <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-[#E2DCCC] text-sm text-navy-700">Cancel</button>
    <button onclick="submitPayment(${id})" class="px-4 py-2 rounded-lg bg-navy-900 text-cream text-sm font-medium">Confirm Payment</button>
  </div>`;

function submitPayment(id){
  const s=students.find(x=>x.id===id);
  const amt=Number(document.getElementById('payAmt').value);
  const method=document.getElementById('payMethod').value;
  let ref=document.getElementById('payRef').value;
  if(!amt||amt<=0){alert('Enter a valid amount.');return;}
  if(!ref) ref=(method==='M-Pesa'?'MP-':method==='Bank'?'BK-':'CS-')+Math.floor(80000+Math.random()*9999);
  if(payments.some(p=>p.ref===ref)){alert('A payment with this reference already exists.');return;}
  const receipt='RCT-'+(receiptCounter++);
  payments.push({ref,student:s.name,amount:amt,method,date:new Date().toISOString().slice(0,10),status:'Completed',receipt});
  s.balance=Math.max(0,s.balance-amt);
  closeModal(); openModal('receipt',receipt);
}

    <div class="flex justify-between"><span class="text-navy-700/50">Method</span><span>${p.method}</span></div>
    <div class="flex justify-between"><span class="text-navy-700/50">Reference</span><span>${p.ref}</span></div>
    <div class="flex justify-between"><span class="text-navy-700/50">Date</span><span>${p.date}</span></div>
    <div class="border-t border-dashed border-[#E2DCCC] my-2"></div>
    <div class="flex justify-between"><span class="text-navy-700/50">Amount Paid</span><span class="font-semibold text-emerald-600">${fmt(p.amount)}</span></div>
    <div class="flex justify-between"><span class="text-navy-700/50">Remaining Balance</span><span class="font-semibold ${s&&s.balance>0?'text-rose-600':'text-emerald-600'}">${fmt(s?s.balance:0)}</span></div>
  </div>
  <div class="flex gap-2 mt-5">
    <button onclick="window.print()" class="flex-1 px-4 py-2 rounded-lg border border-[#E2DCCC] text-sm text-navy-700">Print Receipt</button>
    <button onclick="alert('PDF download requires a connected backend in production.')" class="flex-1 px-4 py-2 rounded-lg bg-navy-900 text-cream text-sm font-medium">Download PDF</button>
  </div>`;
}

/* ---- TIMETABLE ---- */
function mTimetable(){
  const days=['Mon','Tue','Wed','Thu','Fri'];
  const periods=['8:00','9:00','10:20','11:20','2:00'];
  const grid = periods.map((p,pi)=>days.map((d,di)=>SUBJECTS[(pi+di)%SUBJECTS.length]));
  return `${heading('Timetable', (S.role==='parent'?students.find(s=>s.id===S.childId).cls:academicsClass)+' · Weekly view')}
  <div class="card overflow-x-auto"><table class="w-full text-sm min-w-[560px] text-center">
  <thead><tr class="text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th class="text-left px-3 py-2">Time</th>${days.map(d=>`<th class="py-2">${d}</th>`).join('')}</tr></thead>
  <tbody>${periods.map((p,pi)=>`<tr class="border-b border-[#EFEAE0]"><td class="text-left px-3 py-2 text-navy-700/50 text-xs">${p}</td>${grid[pi].map(sub=>`<td class="py-2"><span class="inline-block px-2 py-1 rounded-md bg-gold-500/10 text-navy-800 text-xs">${sub}</span></td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---- STAFF ---- */
function mStaff(){
  return `${heading('Staff', staff.length+' staff members')}
  <div class="card overflow-x-auto"><table class="w-full text-sm min-w-[680px]">
  <thead><tr class="text-left text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th>Name</th><th>Role</th><th>Department</th><th>Phone</th><th>Email</th><th>Status</th></tr></thead>
  <tbody>${staff.map(m=>`<tr><td class="font-medium text-navy-900">${m.name}</td><td>${m.role}</td><td>${m.dept}</td><td class="text-navy-700/60">${m.phone}</td><td class="text-navy-700/60">${m.email}</td><td><span class="badge bg-emerald-100 text-emerald-700">${m.status}</span></td></tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---- LIBRARY ---- */
function mLibrary(){
  const totalCopies=books.reduce((a,b)=>a+b.copies,0), avail=books.reduce((a,b)=>a+b.available,0);
  return `${heading('Library')}
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
    ${statCard('Total Titles',books.length,'','library')}${statCard('Total Copies',totalCopies,'','library')}${statCard('Available',avail,'','library')}${statCard('Borrowed',totalCopies-avail,'','library')}
  </div>
  <div class="card overflow-x-auto"><table class="w-full text-sm min-w-[600px]">
  <thead><tr class="text-left text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th>Title</th><th>Author</th><th>Copies</th><th>Available</th><th>Status</th></tr></thead>
  <tbody>${books.map(b=>`<tr><td class="font-medium text-navy-900">${b.title}</td><td class="text-navy-700/60">${b.author}</td><td>${b.copies}</td><td>${b.available}</td><td><span class="badge ${b.available===0?'bg-rose-100 text-rose-700':'bg-emerald-100 text-emerald-700'}">${b.status}</span></td></tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---- TRANSPORT ---- */
function mTransport(){
  return `${heading('Transport')}
  <div class="grid sm:grid-cols-3 gap-4">
  ${routes.map(r=>`<div class="card p-4"><div class="font-semibold text-navy-900 text-sm mb-2">${r.name}</div>
    <div class="text-xs text-navy-700/60 space-y-1">
      <div class="flex justify-between"><span>Vehicle</span><span class="text-navy-900">${r.vehicle}</span></div>
      <div class="flex justify-between"><span>Driver</span><span class="text-navy-900">${r.driver}</span></div>
      <div class="flex justify-between"><span>Capacity</span><span class="text-navy-900">${r.assigned}/${r.capacity}</span></div>
    </div>
    <div class="mt-2">${bar(r.assigned,r.capacity)}</div>
    <span class="badge bg-emerald-100 text-emerald-700 mt-3 inline-block">${r.status}</span></div>`).join('')}
  </div>`;
}

/* ---- INVENTORY ---- */
function mInventory(){
  return `${heading('Inventory')}
  <div class="card overflow-x-auto"><table class="w-full text-sm min-w-[560px]">
  <thead><tr class="text-left text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th>Item</th><th>Category</th><th>Stock</th><th>Reorder Level</th><th>Status</th></tr></thead>
  <tbody>${inventory.map(i=>`<tr><td class="font-medium text-navy-900">${i.item}</td><td class="text-navy-700/60">${i.cat}</td><td>${i.stock}</td><td>${i.reorder}</td><td><span class="badge ${i.status==='Low Stock'?'bg-rose-100 text-rose-700':'bg-emerald-100 text-emerald-700'}">${i.status}</span></td></tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---- COMMUNICATION ---- */
function mCommunication(){
  return `${heading('Communication Centre')}
  <div class="flex justify-end mb-3"><button onclick="openModal('newAnnouncement')" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-navy-900 text-cream text-xs font-medium">${icon('communication','w-3.5 h-3.5')} New Announcement</button></div>
  <div class="space-y-3">
  ${announcements.map(a=>`<div class="card p-4"><div class="flex justify-between items-start"><div class="font-semibold text-navy-900 text-sm">${a.title}</div><span class="badge bg-navy-900/10 text-navy-800">${a.aud}</span></div><p class="text-sm text-navy-700/65 mt-1">${a.body}</p><div class="text-xs text-navy-700/40 mt-2">${a.date}</div></div>`).join('')}
  </div>`;
}

/* ---- REPORTS ---- */
function mReports(){
  const cats=[['Students',['Enrollment','Gender Distribution','New Admissions']],['Attendance',['Daily Summary','Monthly Trend']],['Finance',['Fee Collection','Outstanding Balances','Transaction History']],['Academics',['Class Performance','Subject Performance']]];
  return `${heading('Reports Centre')}
  <div class="grid md:grid-cols-2 gap-4">
  ${cats.map(([cat,items])=>`<div class="card p-4"><div class="font-semibold text-navy-900 text-sm mb-2">${cat}</div>
    ${items.map(i=>`<div class="flex items-center justify-between py-1.5 text-sm border-b border-[#EFEAE0] last:border-0"><span class="text-navy-700/70">${i}</span><button onclick="alert('Generating ${i} report… (demo)')" class="text-gold-600 text-xs font-medium hover:underline">Generate</button></div>`).join('')}
  </div>`).join('')}
  </div>`;
}

/* ---- SETTINGS ---- */
function mSettings(){
  const items=['School Profile','Campuses','Academic Years','Terms','Classes & Subjects','Grading','Fee Structures','Users & Roles','Notifications','Backup Settings'];
  return `${heading('Settings')}
  <div class="grid sm:grid-cols-2 gap-3">
  ${items.map(i=>`<button class="card p-4 text-left hover:border-gold-500 transition-colors"><div class="font-medium text-navy-900 text-sm">${i}</div><div class="text-xs text-navy-700/45 mt-0.5">Configure ${i.toLowerCase()}</div></button>`).join('')}
  </div>`;
}

/* ---- PARENT PORTAL ---- */
function childSwitcher(){
  const mine = students.filter(s=>[1,4].includes(s.id)); // demo: two siblings
  return `<div class="flex items-center gap-2 mb-5">${mine.map(c=>`<button onclick="S.childId=${c.id};renderModule()" class="px-3 py-1.5 rounded-lg text-xs font-medium border ${S.childId===c.id?'bg-navy-900 text-cream border-navy-900':'border-[#E2DCCC] text-navy-700/60'}">${c.name}</button>`).join('')}</div>`;
}
function pOverview(){
  const s=students.find(x=>x.id===S.childId);
  return `${heading('Parent Portal','Welcome back, '+s.guardian)}${childSwitcher()}
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    ${statCard('Attendance',s.att+'%','',"attendance")}${statCard('Fee Balance',fmt(s.balance),'',"fees")}${statCard('Class',s.cls+' '+s.stream,'',"academics")}${statCard('Status',s.status,'',"students")}
  </div>
  <div class="mt-6 card p-5">
    <h3 class="font-semibold text-navy-900 text-sm mb-3">Latest Announcements</h3>
    ${announcements.slice(0,2).map(a=>`<div class="text-sm border-b border-[#EFEAE0] last:border-0 py-2"><div class="font-medium text-navy-900">${a.title}</div><div class="text-xs text-navy-700/45">${a.date}</div></div>`).join('')}
  </div>`;
}
function pAcademics(){
  const s=students.find(x=>x.id===S.childId);
  const avg=Math.round(Object.values(s.marks).reduce((a,b)=>a+b,0)/Object.values(s.marks).length);
  return `${heading('Academic Performance', s.name+' · '+TERM)}${childSwitcher()}
  <div class="card overflow-x-auto"><table class="w-full text-sm">
  <thead><tr class="text-left text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th>Subject</th><th>Score</th><th>Grade</th></tr></thead>
  <tbody>${Object.entries(s.marks).map(([sub,m])=>`<tr><td>${sub}</td><td>${m}</td><td><span class="badge ${gradeColor(gradeOf(m))}">${gradeOf(m)}</span></td></tr>`).join('')}</tbody></table></div>
  <div class="card p-4 mt-4 text-sm"><span class="text-navy-700/50">Class teacher's comment: </span><span class="italic text-navy-900">${s.comment}</span></div>
  <div class="mt-4 flex gap-2"><button onclick="alert('Report card PDF requires a connected backend in production.')" class="px-4 py-2 rounded-lg bg-navy-900 text-cream text-sm font-medium">Download Report Card</button></div>`;
}
function pAttendance(){
  const s=students.find(x=>x.id===S.childId);
  return `${heading('Attendance', s.name)}${childSwitcher()}
  <div class="card p-5"><div class="text-sm mb-2">Term attendance rate</div><div class="serif text-3xl text-navy-900 mb-3">${s.att}%</div>${bar(s.att,100)}<div class="text-xs text-navy-700/45 mt-3">Today's status: <span class="font-medium text-navy-900">${attendanceToday[s.id]}</span></div></div>`;
}
function pFees(){
  const s=students.find(x=>x.id===S.childId);
  const hist = payments.filter(p=>p.student===s.name);
  return `${heading('Fees', s.name)}${childSwitcher()}
  <div class="card p-5 mb-4 flex justify-between items-center"><div><div class="text-xs text-navy-700/50">Current balance</div><div class="serif text-2xl ${s.balance>0?'text-rose-600':'text-emerald-600'}">${fmt(s.balance)}</div></div><button onclick="alert('Statement download requires a connected backend in production.')" class="px-3.5 py-2 rounded-lg border border-[#E2DCCC] text-sm text-navy-700">Download Statement</button></div>
  <div class="card overflow-x-auto"><table class="w-full text-sm">
  <thead><tr class="text-left text-xs text-navy-700/50 border-b border-[#EFEAE0]"><th>Date</th><th>Amount</th><th>Method</th><th>Receipt</th></tr></thead>
  <tbody>${hist.length?hist.map(p=>`<tr><td class="text-navy-700/60">${p.date}</td><td class="font-medium text-navy-900">${fmt(p.amount)}</td><td>${p.method}</td><td><button onclick="openModal('receipt','${p.receipt}')" class="text-gold-600 text-xs font-medium hover:underline">View</button></td></tr>`).join(''):`<tr><td colspan="4" class="text-center text-navy-700/40 py-8">No payments recorded for this period.</td></tr>`}</tbody></table></div>`;
}

/* ---------------- MODALS ---------------- */
function openModal(type,arg){
  const map={studentProfile:()=>modalStudentProfile(arg),payment:()=>modalPayment(arg),receipt:()=>modalReceipt(arg),
    addStudent:()=>`<h3 class="serif text-xl text-navy-900 mb-4">Add Student</h3><div class="space-y-3">
      <input placeholder="Full name" class="w-full"><input placeholder="Admission number" class="w-full">
      <select class="w-full">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select>
      <input placeholder="Guardian name & phone" class="w-full"></div>
      <button onclick="alert('In production this creates a new student record and admission number.');closeModal()" class="mt-5 px-4 py-2 rounded-lg bg-navy-900 text-cream text-sm font-medium">Save Student</button>`,
    newApplication:()=>`<h3 class="serif text-xl text-navy-900 mb-4">New Admission Application</h3><div class="space-y-3">
      <input placeholder="Applicant full name" class="w-full"><select class="w-full">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select><input placeholder="Parent/guardian contact" class="w-full"></div>
      <button onclick="alert('In production this submits the application for review.');closeModal()" class="mt-5 px-4 py-2 rounded-lg bg-navy-900 text-cream text-sm font-medium">Submit Application</button>`,
    newAnnouncement:()=>`<h3 class="serif text-xl text-navy-900 mb-4">New Announcement</h3><div class="space-y-3">
      <input placeholder="Title" class="w-full"><textarea placeholder="Message" rows="3" class="w-full"></textarea>
      <select class="w-full"><option>All</option><option>Parents</option><option>Students</option><option>Staff</option></select></div>
      <button onclick="alert('In production this publishes the announcement.');closeModal()" class="mt-5 px-4 py-2 rounded-lg bg-navy-900 text-cream text-sm font-medium">Publish</button>`,
  };
  document.getElementById('modal-root').innerHTML = `
  <div class="fixed inset-0 modal-bg flex items-center justify-center z-40 p-4" onclick="if(event.target===this)closeModal()">
    <div class="bg-white rounded-2xl max-w-md w-full max-h-[85vh] overflow-y-auto p-6 relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-navy-700/40 hover:text-navy-900"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      ${map[type]?map[type]():''}
    </div>
  </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ---------------- BOOT ---------------- */
renderLogin();
</script>
</body>
</html>
